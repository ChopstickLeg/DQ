syntax = "proto3";

package dq.v1;

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_COMPLETED = 2;
  JOB_STATUS_ERROR = 3;
}

service QueueService {
  // Returns a job ID only after the pending job commits to SQLite.
  // A duplicate (function_name, submission_key) returns ALREADY_EXISTS.
  rpc Enqueue(EnqueueRequest) returns (EnqueueResponse);
  // Returns persisted state, metadata, and arguments, or NOT_FOUND.
  rpc GetJobStatus(GetJobStatusRequest) returns (GetJobStatusResponse);
  // Returns jobs to execute
  rpc SubscribeExecution(SubscribeRequest) returns (stream ExecuteRequest);
  // Saves the outcome for an assignment before notifying subscribers.
  rpc CompleteExecution(CompleteExecutionRequest) returns (CompleteExecutionResponse);
  rpc SubscribeCompletion(SubscribeRequest) returns (stream ExecuteResponse);
}

message EnqueueRequest {
  string function_name = 1;
  string submission_key = 2;
  bytes arguments = 3;
  string caller = 4;
  string service_name = 5;
}

message EnqueueResponse {
  string job_id = 1;
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  JobStatus status = 1;
  string function_name = 2;
  string caller = 3;
  bytes arguments = 4;
  string service_name = 5;
  optional bytes result = 6;
  optional string error = 7;
}

message ExecuteRequest {
  string job_id = 1;
  string function_name = 2;
  bytes arguments = 3;
  string attempt_id = 4;
}

message CompleteExecutionRequest {
  string job_id = 1;
  string attempt_id = 2;
  oneof outcome {
    bytes result = 3;
    string error = 4;
  }
}

message CompleteExecutionResponse {}

message SubscribeRequest {
  string service_name = 1;
  repeated string function_names = 2;
}

message ExecuteResponse {
  optional bytes result = 1;
  string job_id = 2;
  JobStatus status = 3;
  optional string error = 4;
  string service_name = 5;
  string function_name = 6;
}
