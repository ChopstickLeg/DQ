name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust server (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Prepare SQLite for SQLx
        run: |
          python3 - <<'PY'
          import os
          import sqlite3
          from pathlib import Path

          database = Path(os.environ["RUNNER_TEMP"]) / "dq-build.db"
          with sqlite3.connect(database) as connection:
              for migration in sorted(Path("migrations").glob("*.sql")):
                  connection.executescript(migration.read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"DATABASE_URL=sqlite://{database}\n")
          PY
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint, test, and build server
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          profile=debug
          flags=()
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            profile=release
            flags+=(--release)
          fi
          cargo clippy --locked --all-targets "${flags[@]}" -- -D warnings
          cargo test --locked "${flags[@]}"
          cargo build --locked "${flags[@]}"
          tar -czf "dq-linux-$ARCH.tar.gz" -C "target/$profile" dq
      - name: Verify the server image starts with persistent storage
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "docker/$ARCH"
          tar -xzf "dq-linux-$ARCH.tar.gz" -C "docker/$ARCH"
          docker build --platform "linux/$ARCH" --tag dq:ci docker
          trap 'docker rm -f dq-smoke >/dev/null 2>&1 || true; docker volume rm dq-ci-data >/dev/null 2>&1 || true' EXIT
          docker run --detach --name dq-smoke --volume dq-ci-data:/data --env OTEL_SDK_DISABLED=true dq:ci
          for attempt in {1..30}; do
            if [[ "$(docker logs dq-smoke 2>&1)" == *'Listening on 0.0.0.0:50051'* ]]; then
              docker exec dq-smoke test -s /data/dq.db
              exit 0
            fi
            sleep 1
          done
          docker logs dq-smoke
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dq-server-${{ matrix.arch }}
          path: dq-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  python:
    name: Python SDK
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dq-server-amd64
          path: server
      - name: Build and test Python distributions
        env:
          DQ_SERVER_BIN: ${{ github.workspace }}/server/dq
        run: |
          tar -xzf server/dq-linux-amd64.tar.gz -C server
          python -m pip install build==1.3.0
          python -m build --outdir dist/python sdks/python/dq_python
          python -m pip install dist/python/*.whl
          python -m unittest discover -s sdks/python/dq_python/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dq-python
          path: dist/python/
          if-no-files-found: error

  csharp:
    name: C# SDK and Python worker round trip
    needs: [rust, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dq-server-amd64
          path: server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dq-python
          path: dist/python
      - name: Test and pack C# SDK
        env:
          DQ_SERVER_BIN: ${{ github.workspace }}/server/dq
        run: |
          tar -xzf server/dq-linux-amd64.tar.gz -C server
          python -m pip install dist/python/*.whl
          export DQ_PYTHON_BIN="$(command -v python)"
          dotnet test sdks/csharp/Dq.Client.IntegrationTests --configuration Release
          dotnet pack sdks/csharp/Dq.Client --configuration Release --no-build --output dist/nuget
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dq-nuget
          path: dist/nuget/*.nupkg
          if-no-files-found: error

  required:
    name: CI required
    if: ${{ always() }}
    needs: [rust, python, csharp]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require all test jobs to succeed
        env:
          RUST: ${{ needs.rust.result }}
          PYTHON: ${{ needs.python.result }}
          CSHARP: ${{ needs.csharp.result }}
        run: |
          printf 'Rust: %s\nPython: %s\nC#: %s\n' "$RUST" "$PYTHON" "$CSHARP"
          [[ "$RUST" == success && "$PYTHON" == success && "$CSHARP" == success ]]
