name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned commit from main
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import os
          import tomllib
          import xml.etree.ElementTree as ET
          from pathlib import Path

          expected = os.environ["GITHUB_REF_NAME"][1:]
          versions = {
              "Rust": tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"],
              "Python": tomllib.loads(Path("sdks/python/dq_python/pyproject.toml").read_text())["project"]["version"],
              "C#": ET.parse("sdks/csharp/Dq.Client/Dq.Client.csproj").findtext("./PropertyGroup/Version"),
          }
          for component, version in versions.items():
              if version != expected:
                  raise SystemExit(f"{component} version {version!r} does not match tag v{expected}")
          PY

  verify:
    name: Verify release builds
    needs: validate
    uses: ./.github/workflows/ci.yml

  pypi:
    name: Publish Python SDK to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dq-python
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  nuget:
    name: Publish C# SDK to NuGet
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dq-nuget
          path: dist
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'dist/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  server:
    name: Publish Rust server to Docker Hub
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: dockerhub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dq-server-*
          path: server
      - name: Prepare tested binaries
        shell: bash
        run: |
          for arch in amd64 arm64; do
            mkdir -p "docker/$arch"
            tar -xzf "server/dq-server-$arch/dq-linux-$arch.tar.gz" -C "docker/$arch"
          done
          docker buildx create --driver docker-container --use
      - name: Sign in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Push and verify the multi-platform image
        shell: bash
        run: |
          image="chopstickleg/dq:$GITHUB_REF_NAME"
          docker buildx build --platform linux/amd64,linux/arm64 --tag "$image" --push docker
          docker buildx imagetools inspect --raw "$image" |
            jq -e '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort == ["amd64", "arm64"]'
