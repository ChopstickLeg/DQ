[package]
name = "dq"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.14.4"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
uuid = { version = "1.28", features = ["v7"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tempfile = "3"
